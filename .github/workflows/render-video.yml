name: Render AI Agent TikTok Video
on:
  push:
    branches: [main]
    paths:
      - "render.py"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install free render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Render one continuous 120-second video
        run: python render.py
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cara-kerja-ai-agent-120-detik
          path: output/cara-kerja-ai-agent-120-detik.mp4
          if-no-files-found: error
          retention-days: 7
